name: Publish

on:
    push:
        tags:
            - "v*"

jobs:
    publish:
        name: Publish package
        runs-on: ubuntu-latest

        # Environment name
        environment: npm-publish

        permissions:
            contents: read
            id-token: write

        # services:
        #     postgres:
        #         image: postgres:16
        #         env:
        #             POSTGRES_USER: vsrepo
        #             POSTGRES_PASSWORD: vsrepo
        #             POSTGRES_DB: vsrepo_test
        #         ports:
        #             - 5432:5432
        #         options: >-
        #             --health-cmd "pg_isready -U vsrepo"
        #             --health-interval 5s
        #             --health-timeout 5s
        #             --health-retries 10

        # env:
        #     POSTGRES_URL: postgresql://vsrepo:vsrepo@localhost:5432/vsrepo_test?schema=public

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 26
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # - name: Generate Prisma Client
            #   run: bunx prisma generate

            # - name: Apply database migrations
            #   run: bunx prisma migrate deploy

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

            - name: Stage package
              run: |
                  if [[ "$GITHUB_REF_NAME" == *-* ]]; then
                    PRE="${GITHUB_REF_NAME#*-}"
                    DIST_TAG="${PRE%%.*}"
                  else
                    DIST_TAG="latest"
                  fi

                  echo "Publishing to stage with tag: $DIST_TAG"
                  npm stage publish --tag "$DIST_TAG"
