name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Type Check
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Format Check
              run: bun run format:check

    test:
        name: Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [22, 24, 26]

        # services:
        #     postgres:
        #         image: postgres:16
        #         env:
        #             POSTGRES_USER: vsrepo
        #             POSTGRES_PASSWORD: vsrepo
        #             POSTGRES_DB: vsrepo_test
        #         ports:
        #             - 5432:5432
        #         options: >-
        #             --health-cmd "pg_isready -U vsrepo"
        #             --health-interval 5s
        #             --health-timeout 5s
        #             --health-retries 10

        # env:
        #     POSTGRES_URL: postgresql://vsrepo:vsrepo@localhost:5432/vsrepo_test?schema=public

        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # - name: Generate Prisma Client
            #   run: bunx prisma generate

            # - name: Apply database migrations
            #   run: bunx prisma migrate deploy

            - name: Run tests on Node ${{ matrix.node-version }}
              run: npm test

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, test]
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
                  retention-days: 3
